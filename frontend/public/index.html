<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon-schednext-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Sistema de agendamento para negócios com hora marcada"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Anton&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!--
      Tela de abertura enquanto o JS baixa: fica dentro do #root e o React substitui sozinho no
      primeiro render. CSS inline de propósito (tem que aparecer antes de qualquer arquivo
      carregar). As mesmas classes são usadas pelo TelaCarregando do App.js.
    -->
    <style>
      .sn-preload { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #060b18; }
      .sn-preload-marca { font-family: 'Anton', Impact, 'Arial Narrow', sans-serif; font-size: clamp(44px, 11vw, 150px); line-height: 1; letter-spacing: 0.01em; color: transparent; -webkit-text-stroke: 1.5px #f2f7ff; }
      .sn-preload-linha { width: min(320px, 60vw); height: 2px; background: rgba(160, 200, 255, 0.14); overflow: hidden; border-radius: 2px; }
      .sn-preload-linha span { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, #2554eb, #22d3ee, #19e6d4); animation: sn-preload-corre 1.1s ease-in-out infinite; }
      @keyframes sn-preload-corre { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .sn-preload-linha span { animation: none; width: 100%; } }
    </style>
    <title>SchedNext — Agenda online para negócios de hora marcada</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="sn-preload" role="status" aria-label="Carregando">
        <div class="sn-preload-marca">SCHEDNEXT</div>
        <div class="sn-preload-linha"><span></span></div>
      </div>
    </div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
